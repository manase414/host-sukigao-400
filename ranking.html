<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの好き顔ランキング</title><style>:root{--pink:#ef4e8a;--ink:#1d1830;--line:#ebe4ef}*{box-sizing:border-box}body{margin:0;background:#fbf8fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:38px 0 70px}a{color:inherit}.back{font-size:14px}.eyebrow{color:var(--pink);font-size:13px;font-weight:700;letter-spacing:.08em;margin:28px 0 8px}h1{font-size:clamp(28px,5vw,45px);margin:0 0 12px}p{color:#6b6275;line-height:1.7}.notice{background:#fff;border:1px solid #f4bfd3;border-radius:12px;padding:16px 18px;margin:25px 0}.search{display:block;width:100%;border:1px solid #dcd4e2;border-radius:9px;padding:14px 16px;font:inherit;margin:22px 0}.tabs{display:flex;gap:4px;margin:24px 0 8px}.tabs button{border:0;background:#f0eaf3;padding:11px 16px;font-size:14px;color:#665d70;cursor:pointer}.tabs button.on{background:#fff;color:var(--pink);font-weight:700;border:1px solid var(--line)}.list{background:#fff;border:1px solid var(--line)}.entry{display:grid;grid-template-columns:46px 64px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);text-decoration:none}.entry:last-child{border:0}.place{font-weight:800;color:#73677b;text-align:center}.entry img{width:58px;height:58px;border-radius:7px;object-fit:cover;object-position:50% 35%;background:#f0edf1}.name{font-weight:800}.shop{display:block;font-size:12px;color:#786e80;margin-top:4px}.count{font-size:20px;font-weight:800}.count small{font-size:12px;margin-left:2px}@media(max-width:520px){.wrap{padding-top:25px}.entry{grid-template-columns:28px 52px 1fr;gap:9px;padding:11px}.entry img{width:50px;height:50px}.count{grid-column:3;font-size:15px}.shop{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← 9選をつくる</a><p class="eyebrow">COMMUNITY RANKING</p><h1>みんなの好き顔ランキング</h1><p>みんなの9選に選ばれた回数を集計しています。</p><div class="notice" id="notice">ランキングを読み込んでいます…</div><input id="search" class="search" placeholder="ホスト名・店舗名を入力" aria-label="ホスト名・店舗名を検索"><div class="tabs"><button class="on" data-sort="picked">9選に入った回数</button><button data-sort="first">1位になった回数</button></div><section class="list" id="list"></section></main><script src="config.js"></script><script>function parseCsv(t){const rows=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++}else if(x==='"')q=!q;else if(x===','&&!q){row.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;row.push(c);if(row.length>1)rows.push(row);row=[];c=''}else c+=x}if(c||row.length){row.push(c);rows.push(row)}let[h,...b]=rows;return b.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}const config=window.HOST_RANKING_CONFIG||{},list=document.querySelector('#list'),search=document.querySelector('#search'),notice=document.querySelector('#notice');let people=[],sort='picked';function metric(p){return sort==='first'?p.first_place_count:p.picked_count}function render(){const v=search.value.trim().toLowerCase(),show=people.filter(p=>(p.name+p.shop).toLowerCase().includes(v)).sort((a,b)=>metric(b)-metric(a)||a.name.localeCompare(b.name,'ja'));list.innerHTML=show.map((p,i)=>`<a class="entry" href="detail.html?profile=${encodeURIComponent(p.host2_profile_url)}"><span class="place">${i+1}</span><img src="${p.photo_source_url}" alt="${p.name}"><span><span class="name">${p.name}</span><span class="shop">${p.shop}</span></span><span class="count">${metric(p).toLocaleString()}<small>回</small></span></a>`).join('')||'<p style="padding:20px">該当するホストが見つかりません。</p>'}async function load(){const rows=await fetch('host2-candidates-current.csv').then(r=>r.text()).then(parseCsv);let stats=[];if(config.url&&config.anonKey){const r=await fetch(`${config.url}/rest/v1/host_ranking?select=profile_url,picked_count,first_place_count`,{headers:{apikey:config.anonKey,Authorization:`Bearer ${config.anonKey}`}});if(!r.ok)throw new Error();stats=await r.json();notice.textContent='みんなの9選に選ばれた回数と、1位に選ばれた回数をリアルタイムで集計しています。'}else notice.textContent='共有ランキングの接続を準備中です。';const map=new Map(stats.map(x=>[x.profile_url,x]));people=rows.map(p=>({...p,picked_count:Number(map.get(p.host2_profile_url)?.picked_count||0),first_place_count:Number(map.get(p.host2_profile_url)?.first_place_count||0)}));render()}load().catch(()=>{notice.textContent='ランキングを読み込めませんでした。少し時間をおいて再度お試しください。'});search.oninput=render;document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.classList.toggle('on',x===b));render()});</script></body></html>
