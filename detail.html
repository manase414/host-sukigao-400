<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ホスト詳細 | HOST 好き顔9選</title>
  <style>
    :root{--pink:#f2558b;--purple:#7148dd;--ink:#182136;--muted:#756b80;--bg:#faf7fc;--line:#e9e0ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.wrap{width:min(920px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.back{color:#4f3b5d;font-size:14px}.profile{display:flex;gap:24px;align-items:center;margin:35px 0 25px}.portrait{width:160px;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.profile h1{font-size:clamp(30px,6vw,46px);margin:0 0 8px}.profile p{margin:5px 0;color:var(--muted)}a{color:inherit}.host2{display:inline-block;margin-top:12px;color:var(--purple);font-weight:800}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:25px 0 32px}.stat{background:#fff;padding:22px;border:1px solid var(--line)}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;margin-top:8px;font-size:34px;color:var(--purple)}.panel{background:#fff;padding:22px;border:1px solid var(--line)}.panel h2{font-size:20px;margin:0 0 14px}.bar{height:12px;background:#efeaf3;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9d7be5,#7148dd)}.notice{font-size:13px;line-height:1.7;color:var(--muted)}@media(max-width:560px){.profile{gap:15px;align-items:flex-start}.portrait{width:112px}.stats{grid-template-columns:1fr}.wrap{padding-top:20px}}
  </style>
</head>
<body><main class="wrap"><a class="back" href="index.html">← 好き顔9選へ戻る</a><section id="detail"><p>プロフィールを読み込んでいます…</p></section></main>
<script>
  const profile=new URLSearchParams(location.search).get('profile');
  const parseCsv=text=>{const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.length>1)rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const [heads,...body]=rows;return body.map(r=>Object.fromEntries(heads.map((h,i)=>[h,r[i]||''])))};
  const area=a=>((a||'全国').replace('ホストクラブ','').split('／').pop()||'全国').replace('歌舞伎町','歌舞伎');
  fetch('host2-candidates-clean.csv').then(r=>r.text()).then(parseCsv).then(rows=>{const p=rows.find(x=>x.host2_profile_url===profile),el=document.querySelector('#detail');if(!p){el.innerHTML='<p>プロフィールが見つかりませんでした。</p>';return}const img=p.photo_source_url;el.innerHTML=`<section class="profile"><img class="portrait" src="${img}" alt="${p.name}"><div><h1>${p.name}</h1><p>${area(p.host2_area)} ／ ${p.shop}</p>${p.x_profile_url?`<p><a href="${p.x_profile_url}" target="_blank" rel="noopener">Xプロフィール ↗</a></p>`:''}<a class="host2" href="${p.host2_profile_url}" target="_blank" rel="noopener">ほすほすのプロフィールを見る ↗</a></div></section><section class="stats"><div class="stat"><span>店内月間順位</span><strong>No.${p.host2_monthly_rank||'-'}</strong></div><div class="stat"><span>好き顔9選入り回数</span><strong>0回</strong></div></section><section class="panel"><h2>人気データについて</h2><div class="bar"><i></i></div><p class="notice">現在は集計開始前のため、0回と表示しています。現在のプロフィール情報はほすほすの公開掲載情報を参照しています。</p></section>`}).catch(()=>document.querySelector('#detail').innerHTML='<p>データを読み込めませんでした。</p>');
</script></body></html>
